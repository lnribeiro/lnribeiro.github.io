{{ define "main" }}
<article class="post">
  <header class="post-header">
    <h1>{{ .Title }}</h1>
    {{ if eq .Section "blog" }}
      <div class="post-meta">
        <span>{{ .Date.Format "Jan 2, 2006" }}</span>
        {{ with .Params.tags }}
          <span class="post-tags">
            {{ range . }}<span>#{{ . }}</span>{{ end }}
          </span>
        {{ end }}
      </div>
    {{ end }}
  </header>
  <div class="post-body">
    {{ .Content }}
  </div>
</article>
{{ end }}
